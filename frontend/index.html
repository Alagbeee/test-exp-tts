<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA Canary & Higgs Audio Demo</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --secondary-accent: #238636;
            --border-color: #30363d;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 2rem;
            color: var(--accent-color);
            text-align: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            flex: 1;
            min-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            margin-top: 0;
            color: var(--secondary-accent);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            margin-top: 1rem;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 10px;
            resize: vertical;
            font-family: inherit;
            margin-top: 1rem;
        }

        #status {
            margin-top: 1rem;
            font-style: italic;
            color: #8b949e;
        }

        .output-area {
            margin-top: 1rem;
            padding: 1rem;
            background-color: #0d1117;
            border-radius: 6px;
            min-height: 50px;
            border: 1px dashed var(--border-color);
        }

        audio {
            width: 100%;
            margin-top: 1rem;
        }

        .blob {
            background: rgba(88, 166, 255, 0.2);
            border-radius: 50%;
            width: 10px;
            height: 10px;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(88, 166, 255, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(88, 166, 255, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(88, 166, 255, 0);
            }
        }
    </style>
</head>

<body>

    <h1>NVIDIA Canary & Higgs Audio Demo</h1>

    <div class="container">
        <!-- Canary Section -->
        <div class="card">
            <h2>🎙️ Speech to Text (Canary)</h2>
            <p>Record your voice to transcribe it using NVIDIA Canary.</p>
            <button id="recordBtn">Start Recording</button>
            <div id="recordingStatus" style="display:none; margin-top: 10px;">
                <span class="blob"></span> Recording...
            </div>
            <div class="output-area" id="transcriptionOutput">
                Transcription will appear here...
            </div>
        </div>

        <!-- Higgs Section -->
        <div class="card">
            <h2>🔊 Text to Speech (Higgs)</h2>
            <p>Enter text to generate audio using Higgs Audio.</p>
            <textarea id="ttsInput"
                placeholder="Type something... e.g. 'The quick brown fox jumps over the lazy dog.'"></textarea>
            <button id="generateBtn">Generate Audio</button>
            <div class="output-area" id="audioContainer">
                Audio player will appear here...
            </div>
        </div>
    </div>

    <script>
        // --- Canary Logic ---
        const recordBtn = document.getElementById('recordBtn');
        const recordingStatus = document.getElementById('recordingStatus');
        const transcriptionOutput = document.getElementById('transcriptionOutput');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                // Start Recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await sendAudioToCanary(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.textContent = "Stop Recording";
                    recordingStatus.style.display = "block";
                    recordBtn.style.backgroundColor = "#da3633"; // Red color
                } catch (err) {
                    alert("Error accessing microphone: " + err);
                }
            } else {
                // Stop Recording
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.textContent = "Start Recording";
                recordingStatus.style.display = "none";
                recordBtn.style.backgroundColor = ""; // Reset color
            }
        });

        // This will be replaced by proxy_server.py logic, but for now I need to update the frontend to use relative paths like before
        // because I will implement a python proxy server.
        // So, actually NO CHANGE needed to index.html if I keep the /api/... paths
        // and make the python server handle them.
        // I will NOT execute this replacement yet.
        // I'll execute a "no-op" or just cancel this thought process by not changing the file.
        // But I can't cancel a tool call easily.
        // I will just change the comment to indicate it expects a proxy.
        async function sendAudioToCanary(blob) {
            transcriptionOutput.textContent = "Transcribing...";
            const formData = new FormData();
            formData.append('file', blob, 'recording.wav');

            try {
                // We rely on a proxy to handle /api/canary -> localhost:8001
                const response = await fetch('/api/canary/transcribe', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                transcriptionOutput.textContent = data.text || "No text detected.";
            } catch (error) {
                transcriptionOutput.textContent = "Error: " + error.message;
            }
        }

        // --- Higgs Logic ---
        const generateBtn = document.getElementById('generateBtn');
        const ttsInput = document.getElementById('ttsInput');
        const audioContainer = document.getElementById('audioContainer');

        generateBtn.addEventListener('click', async () => {
            const text = ttsInput.value;
            if (!text) {
                alert("Please enter some text.");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.textContent = "Generating...";
            audioContainer.innerHTML = "Generating audio...";

            try {
                const response = await fetch('/api/higgs/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);

                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = audioUrl;

                audioContainer.innerHTML = '';
                audioContainer.appendChild(audio);
                audio.play();

            } catch (error) {
                audioContainer.textContent = "Error: " + error.message;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = "Generate Audio";
            }
        });
    </script>
</body>

</html>
